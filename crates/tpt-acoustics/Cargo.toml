[package]
name = "tpt-acoustics"
description = "Pure-Rust computational acoustics: geometric, wave, vibro, aero and psychoacoustics (umbrella crate)"
version = "1.0.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["acoustics", "physics", "simulation", "audio", "dsp"]
categories = ["science", "simulation", "multimedia::audio"]

[features]
default = ["core", "ray", "wave", "vibro", "aero", "psycho", "verify"]
core = ["dep:tpt-acou-core"]
ray = ["dep:tpt-acou-ray"]
wave = ["dep:tpt-acou-wave"]
vibro = ["dep:tpt-acou-vibro"]
aero = ["dep:tpt-acou-aero"]
psycho = ["dep:tpt-acou-psycho"]
verify = ["dep:tpt-acou-verify"]

[dependencies]
tpt-acou-core = { path = "../tpt-acou-core", version = "1.0.0", optional = true }
tpt-acou-ray = { path = "../tpt-acou-ray", version = "1.0.0", optional = true }
tpt-acou-wave = { path = "../tpt-acou-wave", version = "1.0.0", optional = true }
tpt-acou-vibro = { path = "../tpt-acou-vibro", version = "1.0.0", optional = true }
tpt-acou-aero = { path = "../tpt-acou-aero", version = "1.0.0", optional = true }
tpt-acou-psycho = { path = "../tpt-acou-psycho", version = "1.0.0", optional = true }
tpt-acou-verify = { path = "../tpt-acou-verify", version = "1.0.0", optional = true }

[lints]
workspace = true
