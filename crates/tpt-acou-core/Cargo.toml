[package]
name = "tpt-acou-core"
description = "tpt-acoustics foundation: acoustic wave equations, media, and unit-safe quantities (no_std + alloc)"
version = "1.0.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["materials"]
# Pull standard structural-material properties from `tpt-mat-database`
# (github.com/tpt-solutions/tpt-materials). Off keeps the crate fully
# no_std (the database crate is std-linked via serde_json).
materials = ["dep:tpt-mat-database"]
# Derive serde traits on the value types. Off by default, so the crate stays
# dependency-light; `Medium` and `Solid` serialise only, because their
# constructors validate and a derived `Deserialize` would skip that check.
serde = ["dep:serde"]

[dependencies]
tpt-math-linalg-complex = { workspace = true }
libm = { workspace = true }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
tpt-mat-database = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
