[package]
name = "tpt-acou-ray"
description = "Geometric acoustics: Image Source Method, Monte Carlo ray tracing, BVH scene intersection (no_std + alloc)"
version = "1.0.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tpt-acou-core = { path = "../tpt-acou-core", version = "1.0.0", default-features = false }
tpt-math-linalg-complex = { workspace = true }
libm = { workspace = true }
rayon = { version = "1", optional = true }

[features]
# Trace rays on the rayon pool. Output is identical to the sequential build,
# because every ray has its own seeded stream. Rayon needs std, so the crate
# links std only with this feature.
parallel = ["dep:rayon"]

[lints]
workspace = true

[dev-dependencies]
# Benchmarks only; never part of the library's dependency graph.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "ray"
harness = false
