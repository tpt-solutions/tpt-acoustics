[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "tpt-acoustics"
description = "Pure-Rust computational acoustics: room, partition and psychoacoustic functions"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]

[tool.maturin]
features = ["pyo3/extension-module"]
