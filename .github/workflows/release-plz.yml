name: release-plz

on:
  push:
    branches: [master]

jobs:
  release-plz:
    # Opens or updates a release pull request with CHANGELOG and version bumps,
    # and tags a GitHub release when that pull request is merged.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
