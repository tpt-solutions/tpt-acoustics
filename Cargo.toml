[workspace]
resolver = "2"
members = [
    "crates/tpt-acou-core",
    "crates/tpt-acou-ray",
    "crates/tpt-acou-wave",
    "crates/tpt-acou-aero",
    "crates/tpt-acou-psycho",
    "crates/tpt-acou-vibro",
    "crates/tpt-acou-verify",
    "crates/tpt-acoustics",
    "crates/tpt-acou-cli",
    "crates/tpt-acou-wasm",
]

[workspace.package]
authors = ["TPT Solutions"]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/tpt-solutions/tpt-acoustics"
repository = "https://github.com/tpt-solutions/tpt-acoustics"
keywords = ["acoustics", "physics", "simulation", "audio", "no-std"]
categories = ["science", "simulation"]

[workspace.dependencies]
# In-house numeric substrate (sibling workspace; see todo.md "Open Decisions").
# no_std crates in this workspace consume the numeric substrate in alloc-only
# mode (std is never needed here; float transcendentals come from `libm`).
tpt-math-linalg-dense = { git = "https://github.com/tpt-solutions/tpt-math", rev = "b22b2b373d337c0e719ffc80a08a7a48cb09c525", version = "0.1.0", default-features = false, features = ["alloc"] }
tpt-math-linalg-complex = { git = "https://github.com/tpt-solutions/tpt-math", rev = "b22b2b373d337c0e719ffc80a08a7a48cb09c525", version = "0.1.0", default-features = false, features = ["alloc"] }
tpt-math-geometry = { git = "https://github.com/tpt-solutions/tpt-math", rev = "b22b2b373d337c0e719ffc80a08a7a48cb09c525", version = "0.1.1" }
tpt-math-numeric = { git = "https://github.com/tpt-solutions/tpt-math", rev = "b22b2b373d337c0e719ffc80a08a7a48cb09c525", version = "0.1.0" }
tpt-math-signal-fft = { git = "https://github.com/tpt-solutions/tpt-math", rev = "b22b2b373d337c0e719ffc80a08a7a48cb09c525", version = "0.1.0" }
tpt-math-signal-filter = { git = "https://github.com/tpt-solutions/tpt-math", rev = "b22b2b373d337c0e719ffc80a08a7a48cb09c525", version = "0.1.0" }
tpt-math-autodiff = { git = "https://github.com/tpt-solutions/tpt-math", rev = "b22b2b373d337c0e719ffc80a08a7a48cb09c525", version = "0.1.0" }
tpt-fem-sparse = { git = "https://github.com/tpt-solutions/tpt-fem", rev = "366512b3cf1dd4a59dcb2f3a1ed6874eb3e72eb3", version = "0.1.1" }
tpt-fem-modal = { git = "https://github.com/tpt-solutions/tpt-fem", rev = "366512b3cf1dd4a59dcb2f3a1ed6874eb3e72eb3", version = "0.2.0" }
# GitHub-hosted family crates (github.com/tpt-solutions), cloned as siblings.
tpt-dsp-core = { git = "https://github.com/tpt-solutions/tpt-dsp", rev = "ebf36bd4340c50a02cfac65554c0d07e551d3fb6", version = "0.1.0", default-features = false }
tpt-mat-database = { git = "https://github.com/tpt-solutions/tpt-materials", rev = "6bf2d3da182b6d9cc8092752c55c861ca99be113", version = "0.1.0" }
num-complex = { version = "0.4", default-features = false, features = ["libm"] }

libm = "0.2"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"
# The Kani verifier builds with `--cfg kani`; teach cargo's cfg checker so
# `#[cfg(kani)]` modules don't warn.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
# Numerical code indexes small fixed-size arrays in tight loops; the indexed
# forms are the clearest expression of the math here, so the allowance must
# out-prioritize the group.
all = { level = "warn", priority = -1 }
needless_range_loop = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
