# cargo-deny configuration — license/security/dependency hygiene.
# Mirrors the tpt-math / tpt-fem family policy: MIT / Apache-2.0 / dual only.
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"

[licenses]
# All workspace crates are MIT OR Apache-2.0. The allow-list also permits the
# permissive licenses of transitive dependencies pulled in by dev/build tooling.
# Apache-2.0-only crates are intentionally NOT on this list: per spec.txt §2,
# no Apache-2.0-only dependency may enter the graph.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# In-house sibling crates (house convention), pinned by `rev` in Cargo.toml.
allow-git = [
    "https://github.com/tpt-solutions/tpt-math",
    "https://github.com/tpt-solutions/tpt-fem",
    "https://github.com/tpt-solutions/tpt-dsp",
    "https://github.com/tpt-solutions/tpt-materials",
]
